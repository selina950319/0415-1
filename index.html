<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>淡江大學教育科技學系測驗卷</title>
  <style>
    body {
      font-family: "微軟正黑體", sans-serif;
      background: linear-gradient(to bottom right, #e0c3fc, #8ec5fc);
      margin: 0;
      padding: 2em;
      color: #333;
    }
    h1 {
      color: #4a4e69;
      text-align: center;
    }
    .quiz-container {
      max-width: 700px;
      margin: auto;
      background: #ffffffcc;
      border-radius: 12px;
      padding: 2em;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .question {
      margin-bottom: 1.5em;
    }
    .question h3 {
      color: #222;
    }
    label {
      display: block;
      margin: 0.5em 0;
      cursor: pointer;
    }
    input[type="radio"] {
      margin-right: 10px;
    }
    button {
      background-color: #4a4e69;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 1em;
    }
    button:hover {
      background-color: #9a8c98;
    }
    #result {
      margin-top: 2em;
      font-weight: bold;
      color: #222;
      text-align: center;
    }
    .correct-answer {
      color: green;
      font-weight: bold;
    }
    .wrong-answer {
      color: red;
    }
    .explanation {
      font-size: 0.95em;
      color: #555;
      margin-top: 0.3em;
    }
    .reset {
      margin-left: 1em;
      background-color: #999;
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h1>淡江大學教育科技學系測驗卷</h1>
    <form id="quizForm"></form>
    <div style="text-align:center">
      <button type="button" onclick="submitQuiz()">提交測驗</button>
      <button type="button" class="reset" onclick="resetQuiz()">重新作答</button>
    </div>
    <div id="result"></div>
  </div>

  <script>
    const allQuestions = [
      {
        question: "教育科技學系主要研究什麼？",
        options: ["農業科技", "教育與科技的整合應用", "生物醫學", "財務分析"],
        answer: "B",
        explanation: "正確答案是 B：教育科技學系專注於教育與科技的整合應用。"
      },
      {
        question: "教育科技學系畢業生最有可能從事哪一類工作？",
        options: ["教育訓練與數位學習設計", "餐飲服務", "醫院護理", "建築設計"],
        answer: "A",
        explanation: "正確答案是 A：畢業後可從事教育訓練、數位教學設計等。"
      },
      {
        question: "以下哪一個是教育科技學系常用的數位工具？",
        options: ["Excel", "Photoshop", "Moodle 或 Google Classroom", "AutoCAD"],
        answer: "C",
        explanation: "正確答案是 C：常用的教學平台包括 Moodle、Google Classroom 等。"
      },
      {
        question: "教育科技學系常見課程包括？",
        options: ["數位教材設計", "農機維修", "獸醫實習", "鋼筋施工"],
        answer: "A",
        explanation: "正確答案是 A：課程包含數位教材設計與多媒體教學應用。"
      },
      {
        question: "教育科技系常參與哪類型專案？",
        options: ["線上課程平台開發", "製造業排程設計", "考古挖掘計畫", "生態攝影記錄"],
        answer: "A",
        explanation: "正確答案是 A：學生常參與教學平台、互動教材開發。"
      },
      {
        question: "教育科技系強調哪種能力？",
        options: ["科技與教育整合設計能力", "軍事戰略規劃", "機械加工技能", "臨床護理判斷"],
        answer: "A",
        explanation: "正確答案是 A：強調科技與教育的整合與應用能力。"
      },
      {
        question: "教育科技系的畢業專題常見形式是？",
        options: ["數位學習產品製作", "物理模擬裝置", "機械零件組裝", "商業談判模擬"],
        answer: "A",
        explanation: "正確答案是 A：學生常製作數位教材、互動學習系統作為專題。"
      },
      {
        question: "以下哪一項最貼近教育科技的目標？",
        options: ["提升學習效率與動機", "改善交通運輸", "促進經濟成長", "發展火箭科技"],
        answer: "A",
        explanation: "正確答案是 A：教育科技核心是提升教學與學習效果。"
      },
      {
        question: "教育科技與哪些領域密切合作？",
        options: ["資訊工程與心理學", "牙醫學與農學", "天文學與化學", "建築與土木"],
        answer: "A",
        explanation: "正確答案是 A：常與資訊與心理學跨域合作，設計有效教學工具。"
      }
    ];

    let selectedQuestions = [];

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function renderQuiz() {
      selectedQuestions = shuffle([...allQuestions]).slice(0, 3);
      const form = document.getElementById("quizForm");
      form.innerHTML = "";
      selectedQuestions.forEach((q, index) => {
        const qId = `q${index + 1}`;
        let html = `<div class='question'>`;
        html += `<h3>${index + 1}. ${q.question}</h3>`;
        q.options.forEach((opt, i) => {
          const optChar = String.fromCharCode(65 + i);
          html += `<label><input type='radio' name='${qId}' value='${optChar}'> ${optChar}. ${opt}</label>`;
        });
        html += `<div class='explanation' id='ex-${qId}'></div></div>`;
        form.innerHTML += html;
      });
    }

    function submitQuiz() {
      let score = 0;
      selectedQuestions.forEach((q, index) => {
        const qId = `q${index + 1}`;
        const selected = document.querySelector(`input[name="${qId}"]:checked`);
        const explanationDiv = document.getElementById("ex-" + qId);
        explanationDiv.innerHTML = "";

        if (selected) {
          if (selected.value === q.answer) {
            score++;
            explanationDiv.innerHTML = `<span class='correct-answer'>✔ 正確！</span> ${q.explanation}`;
          } else {
            explanationDiv.innerHTML = `<span class='wrong-answer'>✘ 錯誤。</span> ${q.explanation}`;
          }
        } else {
          explanationDiv.innerHTML = `<span class='wrong-answer'>✘ 未作答。</span> ${q.explanation}`;
        }
      });
      const result = document.getElementById("result");
      result.innerHTML = `你答對了 ${score} / ${selectedQuestions.length} 題，得分：${Math.round(score / selectedQuestions.length * 100)} 分！`;
    }

    function resetQuiz() {
      document.getElementById("result").innerHTML = "";
      renderQuiz();
    }

    // 初始化畫面
    window.onload = renderQuiz;
  </script>
</body>
</html>
